databases:
  - name: ztvis-db
    databaseName: ztvis_db
    user: ztvis_user
    plan: free

services:
  # ── Spring Boot Backend ──────────────────────────────────────────
  - type: web
    name: zt-vis-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ztvis-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: ztvis-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ztvis-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: zt-vis-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ── React Frontend ───────────────────────────────────────────────
  - type: web
    name: zt-vis-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: zt-vis-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
