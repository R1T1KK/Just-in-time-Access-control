version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ztvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ztvis_db
      POSTGRES_USER: ztvis_user
      POSTGRES_PASSWORD: ztvis_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztvis_user -d ztvis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ztvis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ztvis_db
      SPRING_DATASOURCE_USERNAME: ztvis_user
      SPRING_DATASOURCE_PASSWORD: ztvis_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: ZeroTrustVisitorIdentityPlatformSuperSecretKey256BitsLong!!
      APP_JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
