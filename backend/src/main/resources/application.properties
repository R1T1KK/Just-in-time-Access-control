# ===== Application =====
spring.application.name=ztvis-backend
server.port=${PORT:8080}

# ===== DataSource =====
# In production (Render), set DATABASE_URL env var to Render's PostgreSQL external URL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ztvis_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:ztvis_user}
spring.datasource.password=${DB_PASSWORD:ztvis_pass}

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Flyway =====
spring.flyway.enabled=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:ZeroTrustVisitorIdentityPlatformSuperSecretKey256BitsLong!!}
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# ===== Logging =====
logging.level.com.ztvis=INFO
logging.level.org.springframework.security=WARN
