# ===== Application =====
spring.application.name=ztvis-backend
server.port=${PORT:8080}

# ===== DataSource =====
# Render: set SPRING_DATASOURCE_URL = jdbc:postgresql://host:5432/ztvis_db
# Render: set SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Flyway =====
spring.flyway.enabled=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:ZeroTrustVisitorIdentityPlatformSuperSecretKey256BitsLong!!}
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# ===== Logging =====
logging.level.com.ztvis=INFO
logging.level.org.springframework.security=WARN
